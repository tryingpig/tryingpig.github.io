<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Industry Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏭</text></svg>">
<!--
  Industry Log 뷰어 (껍데기).
  내용은 비공개 저장소 tryingpig/industry-report 의 site/index.html 과 site/f/*.jpg 에 있고,
  PC가 매일 새벽 다시 만들어 올린다. 이 페이지는 열 때마다 그 최신본을 GitHub API 로 읽어 와 보여준다.
  이 파일에는 내용도 토큰도 없다. 토큰은 리포트 뷰어와 같은 자리(이 기기 localStorage 'rv_pat')를 쓴다.
-->
<style>
  :root{--sbg:#fffffc;--sfg:#0b0b0c;--smuted:#667085;--sline:#e4e4da;--saccent:#0b0b0c;--ssurface:#f7f7f1}
  @media (prefers-color-scheme: dark){:root{--sbg:#0e0e0d;--sfg:#f4f4ee;--smuted:#9aa1ad;--sline:#2b2b28;--saccent:#f4f4ee;--ssurface:#191918;color-scheme:dark}}
  html,body{margin:0}
  body{background:var(--sbg);color:var(--sfg);font-family:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  img{max-width:100%}
  [hidden]{display:none!important}
  #gate{max-width:30rem;margin:12vh auto;padding:24px;background:var(--ssurface);border:1px solid var(--sline);border-radius:10px;line-height:1.7}
  #gate h1{font-size:1.3rem;margin:0 0 8px}
  #gate p{margin:0 0 12px;color:var(--smuted);font-size:.93rem}
  #gate input{width:100%;box-sizing:border-box;padding:10px;font-size:1rem;border:1px solid var(--sline);border-radius:6px;background:var(--sbg);color:var(--sfg)}
  #gate button{margin-top:12px;padding:10px 18px;font-size:1rem;border:0;border-radius:6px;background:var(--saccent);color:var(--ssurface);cursor:pointer}
  #gate .err{color:#b3443f;font-size:.9rem;margin-top:10px}
  #status{padding:40px 16px;text-align:center;color:var(--smuted)}
  #shellbar{max-width:54rem;margin:0 auto;padding:8px 16px 40px;font-size:.8rem;color:var(--smuted);display:flex;gap:16px;flex-wrap:wrap}
  #shellbar button{border:0;background:none;color:var(--smuted);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0}
  img.wait{min-height:120px;background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(128,128,128,.08) 10px 20px)}
</style>
</head>
<body>
<div id="status">불러오는 중…</div>
<div id="gate" hidden>
  <h1>Industry Log</h1>
  <p id="gatemsg">비공개 저장소라 열람용 GitHub 토큰이 필요합니다. 토큰은 이 기기에만 저장됩니다.</p>
  <label for="pat" style="font-size:.85rem">GitHub 토큰 (tryingpig/industry-report 를 읽을 수 있어야 합니다)</label>
  <input id="pat" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_… 또는 ghp_…">
  <button id="save" type="button">저장하고 열기</button>
  <div class="err" id="gateerr" hidden></div>
</div>
<div id="app" hidden></div>
<div id="shellbar" hidden><span id="updated"></span><button id="reset" type="button">토큰 바꾸기</button></div>

<script src="share.js"></script>
<script>
(function () {
  var OWNER = "tryingpig", REPO = "industry-report", API = "https://api.github.com", PAT_KEY = "rv_pat";
  var $ = function (id) { return document.getElementById(id); };
  var urls = {};            // 그림 경로 → 받아 둔 blob 주소

  function getPat() { try { return localStorage.getItem(PAT_KEY) || ""; } catch (e) { return ""; } }
  function setPat(v) { try { localStorage.setItem(PAT_KEY, v); } catch (e) {} }

  function gh(path, raw) {
    return fetch(API + "/repos/" + OWNER + "/" + REPO + "/" + path, {
      headers: { "Authorization": "Bearer " + getPat(), "Accept": raw ? "application/vnd.github.raw" : "application/vnd.github+json",
                 "X-GitHub-Api-Version": "2022-11-28" },
      cache: "no-store"
    });
  }

  function showGate(msg, isErr) {
    $("status").hidden = true; $("app").hidden = true; $("shellbar").hidden = true; $("gate").hidden = false;
    if (msg) { $("gateerr").textContent = msg; $("gateerr").hidden = !isErr; if (!isErr) $("gatemsg").textContent = msg; }
  }

  function loadImage(img) {
    var path = img.getAttribute("data-path");
    if (!path || img.getAttribute("data-state")) return Promise.resolve();
    img.setAttribute("data-state", "loading");
    var p = urls[path] ? Promise.resolve(urls[path]) : gh("contents/" + path, true).then(function (r) {
      if (!r.ok) throw new Error("그림 " + r.status);
      return r.blob();
    }).then(function (b) { urls[path] = URL.createObjectURL(b); return urls[path]; });
    return p.then(function (u) { img.src = u; img.classList.remove("wait"); img.setAttribute("data-state", "done"); })
            .catch(function () { img.removeAttribute("data-state"); });
  }

  window.IL_loadImage = loadImage;          // 카드 공유(share.js)가 아직 안 받은 그림을 받을 때 쓴다

  var PAGE_RE = /^[a-z0-9_-]+\.html$/;      // 저장소 site/ 안의 쪽 이름만 허용
  var imgWatch = null;

  function curPage() {
    var p = new URLSearchParams(location.search).get("p") || "index.html";
    return PAGE_RE.test(p) ? p : "index.html";
  }

  function render(html) {
    var doc = new DOMParser().parseFromString(html, "text/html");
    // 쪽을 옮길 때마다 앞 쪽의 스타일은 걷어 내고 새 쪽 것을 넣는다
    document.head.querySelectorAll("[data-from-site]").forEach(function (n) { n.remove(); });
    doc.querySelectorAll('link[rel="stylesheet"], style').forEach(function (n) {
      var c = document.importNode(n, true); c.setAttribute("data-from-site", "1"); document.head.appendChild(c);
    });
    doc.querySelectorAll("script").forEach(function (n) { n.remove(); });
    var app = $("app");
    app.innerHTML = doc.body.innerHTML;
    if (imgWatch) imgWatch.disconnect();
    imgWatch = ("IntersectionObserver" in window) ? new IntersectionObserver(function (es) {
      es.forEach(function (e) { if (e.isIntersecting) { imgWatch.unobserve(e.target); loadImage(e.target); } });
    }, { rootMargin: "600px" }) : null;
    app.querySelectorAll("img").forEach(function (img) {
      var src = img.getAttribute("src") || "";
      if (!src || /^(data:|blob:|https?:)/.test(src)) return;
      img.setAttribute("data-path", "site/" + src);
      img.removeAttribute("src"); img.removeAttribute("loading"); img.classList.add("wait");
      if (imgWatch) imgWatch.observe(img); else loadImage(img);
    });
    $("status").hidden = true; $("gate").hidden = true; app.hidden = false; $("shellbar").hidden = false;
  }

  // 눌림 처리는 한 번만 건다(쪽을 옮겨도 그대로 쓴다)
  $("app").addEventListener("click", function (e) {
    var app = $("app"), lb = app.querySelector("#lb");
    var sh = e.target.closest(".share");
    if (sh) { if (window.ILShare) window.ILShare(sh.closest("details.topic")); return; }
    var f = e.target.closest(".fold");
    if (f) { var t = f.closest("details.topic"); if (t) { t.open = false; t.scrollIntoView({ block: "start" }); } return; }
    var j = e.target.closest("a.jump");
    if (j) {                               // 같은 쪽 안의 카드로: 접혀 있으면 펼치고 그리로 간다
      var g = document.getElementById((j.getAttribute("href") || "").slice(1));
      if (g) { e.preventDefault(); if (g.tagName === "DETAILS") g.open = true; g.scrollIntoView({ block: "start" }); }
      return;
    }
    var a = e.target.closest("a[href]");
    if (a) {
      var href = a.getAttribute("href") || "";
      if (PAGE_RE.test(href)) {            // 산업 쪽·첫 화면으로 가는 연결: 새로 읽어 와 바꿔 끼운다
        e.preventDefault();
        history.pushState(null, "", href === "index.html" ? location.pathname : location.pathname + "?p=" + href);
        start(true);
      }
      return;
    }
    var z = e.target.closest(".zoom");
    if (z && lb) {
      var im = z.querySelector("img");
      loadImage(im).then(function () { if (im.src) { lb.querySelector("img").src = im.src; lb.hidden = false; } });
      return;
    }
    if (lb && !lb.hidden) lb.hidden = true;
  });
  document.addEventListener("keydown", function (e) {
    var lb = $("app").querySelector("#lb");
    if (e.key === "Escape" && lb) lb.hidden = true;
  });
  window.addEventListener("popstate", function () { start(true); });

  function start(toTop) {
    if (!getPat()) { showGate(); return; }
    // 토큰은 영문·숫자·기호뿐이어야 한다. 한글이나 보이지 않는 문자가 섞여 있으면 요청 자체가 만들어지지 않는다.
    if (!/^[\x21-\x7e]+$/.test(getPat())) {
      showGate("이 기기에 저장된 토큰에 한글이나 공백 같은 글자가 섞여 있어 쓸 수 없습니다. 토큰을 다시 넣어 주세요.", true); return;
    }
    var page = curPage();
    $("app").hidden = true; $("shellbar").hidden = true;
    $("status").hidden = false; $("status").textContent = "불러오는 중…"; $("gate").hidden = true;
    gh("contents/site/" + page, true).then(function (r) {
      if (r.status === 401) { showGate("토큰이 만료됐거나 잘못됐습니다. 다시 넣어 주세요.", true); return null; }
      if (r.status === 404 && page !== "index.html") {       // 없어진 쪽이면 첫 화면으로
        history.replaceState(null, "", location.pathname); start(true); return null;
      }
      if (r.status === 403 || r.status === 404) {
        showGate("이 토큰으로는 tryingpig/industry-report 저장소를 볼 수 없습니다. 이 저장소 읽기 권한이 있는 토큰을 넣어 주세요.", true); return null;
      }
      if (!r.ok) throw new Error("GitHub 응답 " + r.status);
      return r.text();
    }).then(function (html) {
      if (html == null) return;
      render(html);
      if (toTop) window.scrollTo(0, 0);
      else if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
      gh("commits?path=site/" + page + "&per_page=1").then(function (r) { return r.ok ? r.json() : []; }).then(function (c) {
        if (c && c[0]) {
          var d = new Date(c[0].commit.committer.date);
          $("updated").textContent = "이 쪽 마지막 갱신: " + d.toLocaleString("ko-KR", { dateStyle: "medium", timeStyle: "short" });
        }
      }).catch(function () {});
    }).catch(function (e) {
      $("status").hidden = false; $("status").textContent = "불러오지 못했습니다: " + e.message + " (새로고침해 보세요)";
    });
  }

  $("save").addEventListener("click", function () {
    var v = $("pat").value.replace(/\s+/g, "");
    if (!v) { $("gateerr").textContent = "토큰을 넣어 주세요."; $("gateerr").hidden = false; return; }
    if (!/^[\x21-\x7e]+$/.test(v)) {
      $("gateerr").textContent = "토큰에는 영문·숫자·기호만 들어갑니다. GitHub에서 복사한 토큰을 그대로 붙여 넣어 주세요."; $("gateerr").hidden = false; return;
    }
    setPat(v); $("pat").value = ""; $("gateerr").hidden = true; start();
  });
  $("pat").addEventListener("keydown", function (e) { if (e.key === "Enter") $("save").click(); });
  $("reset").addEventListener("click", function () { showGate("새 토큰을 넣으면 이 기기에 저장된 토큰이 바뀝니다. 리포트 뷰어도 같은 토큰을 씁니다."); });
  start();
})();
</script>
</body>
</html>
