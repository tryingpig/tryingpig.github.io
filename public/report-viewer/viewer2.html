<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
  <title>리포트 뷰어 v2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=28">
  <style>
    /* v2 전용 — 기존 뷰어 CSS는 손대지 않는다 */
    #host { position:absolute; inset:0; top:var(--topbar-h,48px); }
    #host > div { position:absolute; inset:0; }
    body { overflow:hidden; }
    body.reading-on { overflow:auto; }
    body.reading-on #host { display:none; }
    .v2-msg { padding:14px; font-size:13px; line-height:1.7; }
    .v2-err { color:#c0392b; }
    .v2-badge { font-size:11px; opacity:.7; margin-left:6px; }
    /* 삭제는 되돌릴 수 없으니 다른 버튼과 눈에 띄게 구분해 둔다(오탭 방지) */
    .v2-del { color:#dc2626; border-color:rgba(220,38,38,.35); }
    .v2-del:hover:not(:disabled) { background:#dc2626; border-color:#dc2626; color:#fff; }
    .v2-del:disabled { opacity:.5; }
    /* 낭독 — 지금 읽는 문단 표시.
       하이라이트(노랑/초록/분홍 배경)와 헷갈리지 않게 배경 대신 왼쪽 띠를 주 신호로 쓴다. */
    .tts-now { position:relative; background:var(--ink-bg); border-radius:4px; }
    .tts-now::before { content:""; position:absolute; left:-10px; top:2px; bottom:2px;
      width:3px; background:var(--ink); border-radius:2px; }
    .btn.tts-off { opacity:.45; }
    .tts-bar { position:fixed; left:50%; transform:translateX(-50%); z-index:60;
      bottom:calc(14px + env(safe-area-inset-bottom, 0px));
      display:flex; gap:2px; align-items:center; padding:5px 6px;
      background:var(--card); border:1px solid var(--line); border-radius:999px;
      box-shadow:0 6px 22px rgba(0,0,0,.20); }
    .tts-bar button { border:0; background:transparent; color:var(--text);
      font-size:15px; line-height:1; padding:8px 10px; border-radius:999px; cursor:pointer; }
    .tts-bar button:hover { background:var(--raise); }
    .tts-bar #ttsRate { font-size:12px; color:var(--sub); font-variant-numeric:tabular-nums; min-width:38px; }
    .tts-bar #ttsClose { color:var(--sub); }
    .tts-bar #ttsVoice { max-width:96px; font-size:12px; color:var(--sub);
      background:transparent; border:0; border-radius:999px; padding:6px 2px; cursor:pointer; }
    /* 폰에선 버튼 글자 라벨을 감춘다 — 아이콘만 남긴다.
       읽기 모드에선 컨트롤이 7개까지 늘어 414px 화면에서 제목과 🗑 이 밀려났다.
       (목록 화면 상단바는 건드리지 않게 .viewer-topbar 안으로 한정) */
    @media (max-width: 640px) {
      .viewer-topbar .btn-txt { display:none; }
      /* 아이콘만 남으면 좌우 여백이 과하다 — 줄여서 제목이 들어설 자리를 만든다 */
      .viewer-topbar { gap:4px; }
      .viewer-topbar .btn { padding:0 7px; }
    }
  </style>
</head>
<body>
  <div class="topbar viewer-topbar" id="topbar">
    <a class="back" href="index.html">‹</a>
    <h1 id="docTitle">불러오는 중…</h1>
    <span class="v2-badge" id="hlCount"></span>
    <div class="spacer"></div>
    <button class="btn" id="capBtn" title="영역 캡처(드래그)">✂️</button>
    <button class="btn" id="modeBtn" title="읽기/PDF 전환">📖<span class="btn-txt"> 읽기</span></button>
    <button class="btn" id="llmBtn" title="읽기 본문을 LLM으로 정리 요청" style="display:none">🤖<span class="btn-txt"> LLM</span></button>
    <button class="btn" id="ttsBtn" title="본문 낭독" style="display:none">🔊</button>
    <a class="btn" id="hlLink" title="하이라이트 모아보기">📋<span class="btn-txt"> 모아보기</span></a>
    <button class="btn v2-del" id="delReportBtn" title="이 리포트 삭제" aria-label="이 리포트 삭제">🗑</button>
  </div>
  <div id="host"><div class="v2-msg" id="boot">여는 중…</div></div>
  <div id="readingContainer" class="reading" style="display:none"></div>
  <div class="tts-bar" id="ttsBar" style="display:none">
    <button id="ttsPrev" title="이전 문단" aria-label="이전 문단">⏮</button>
    <button id="ttsPlay" title="재생/일시정지" aria-label="재생/일시정지">⏸</button>
    <button id="ttsNext" title="다음 문단" aria-label="다음 문단">⏭</button>
    <button id="ttsRate" title="읽는 속도">1.0×</button>
    <select id="ttsVoice" title="목소리" aria-label="목소리"></select>
    <button id="ttsClose" title="낭독 끝내기" aria-label="낭독 끝내기">✕</button>
  </div>
  <div class="toast" id="toast"></div>

  <script src="app.js?v=22"></script>
  <script type="module">
    import EmbedPDF, { PdfAnnotationSubtype }
      from "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js";

    const params = new URLSearchParams(location.search);
    const REPORT_ID = params.get("id");
    const HL = PdfAnnotationSubtype.HIGHLIGHT;
    const SQ = PdfAnnotationSubtype.SQUARE;   // 캡처(type=image) 영역 표시용 사각형
    // 목록·모아보기에서 넘어오는 딥링크 파라미터(v1과 같은 규약)
    const START_MODE = params.get("mode") === "read" ? "reading" : "pdf";
    const GOTO_PAGE = parseInt(params.get("page") || "0", 10);
    const GOTO_HL = params.get("hl") || "";

    /* 읽던 페이지 이어보기.
       30페이지짜리 리포트를 보다 나가면 다시 1페이지부터였다. 페이지가 바뀔 때마다
       기록해 두고, 목록에서 그냥 열었을 때(딥링크 파라미터가 없을 때)만 그 자리로 되돌린다.
       hl·page 로 들어온 경우는 사용자가 갈 곳을 지목한 것이므로 건드리지 않는다. */
    const LASTPAGE_KEY = "rv_lastpage_" + REPORT_ID;
    const RESUME_OK = !GOTO_HL && !GOTO_PAGE;
    /* 문서를 열면 관찰자·스크롤 플러그인이 곧바로 '1페이지'를 알린다. 그걸 그대로 저장하면
       복원하기도 전에 기록이 1로 덮여, 다음에 열 때 다시 처음부터가 된다.
       그래서 초기 위치잡기가 끝난 뒤에야 기록을 시작한다. */
    let trackReady = false;
    const startTracking = () => { trackReady = true; };
    function saveLastPage(n) {
      if (!trackReady) return;
      n = parseInt(n, 10);
      if (!REPORT_ID || !n || n < 1) return;
      try { localStorage.setItem(LASTPAGE_KEY, String(n)); } catch (e) {}
    }
    /* 1페이지면 되돌릴 것이 없으니 0을 준다(맨 위로 돌아온 상태를 저장해 두는 건 정상). */
    function lastPage() {
      if (!RESUME_OK) return 0;
      const n = parseInt(localStorage.getItem(LASTPAGE_KEY) || "0", 10);
      return n > 1 ? n : 0;
    }

    /* 기존 하이라이트 색 이름 ↔ 화면 색.
       EmbedPDF 툴은 자유 색을 주므로, 저장할 때는 가장 가까운 이름으로 되돌린다
       (모아보기·노션·PDF 굽기가 이름을 쓴다). */
    const COLOR_HEX = { yellow: "#FFE066", green: "#7CE38B", pink: "#FF9FB1" };
    /* 색 문자열 → [r,g,b]. 읽어내지 못하면 null 을 준다.
       ★ 예전엔 실패해도 [0,0,0] 을 돌려줬는데, 검정에서 제일 가까운 이름이 초록이라
         색을 못 읽을 때마다 하이라이트가 조용히 초록으로 저장됐다(노랑만 썼는데 초록이 섞인 원인).
         그래서 '실패'와 '검정'을 구분한다. */
    function parseColor(v) {
      if (typeof v !== "string") return null;
      const s = v.trim();
      const m = s.match(/^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)/i);
      if (m) return [ +m[1], +m[2], +m[3] ].map((x) => Math.max(0, Math.min(255, Math.round(x))));
      const hx = s.replace("#", "");
      const v6 = hx.length === 3 ? hx.split("").map((c) => c + c).join("") : hx;
      if (!/^[0-9a-f]{6}/i.test(v6)) return null;
      return [0, 2, 4].map((i) => parseInt(v6.slice(i, i + 2), 16));
    }
    /* 색을 못 읽으면 fallback 을 그대로 쓴다(기본 노랑). 억지로 가까운 이름을 만들지 않는다. */
    function nearestColorName(color, fallback) {
      const t = parseColor(color);
      if (!t) return fallback || "yellow";
      let best = "yellow", bd = Infinity;
      for (const [name, h] of Object.entries(COLOR_HEX)) {
        const c = parseColor(h);
        const d = (t[0]-c[0])**2 + (t[1]-c[1])**2 + (t[2]-c[2])**2;
        if (d < bd) { bd = d; best = name; }
      }
      return best;
    }

    /* ── PDF 캐시: 기존 뷰어와 같은 IndexedDB를 쓴다(중복 다운로드 방지) ── */
    const PDF_DB = "rv_pdfcache", PDF_STORE = "pdfs", ASSET_STORE = "assets";
    function idbOpen() {
      return new Promise((res, rej) => {
        const rq = indexedDB.open(PDF_DB, 2);
        rq.onupgradeneeded = () => {
          const db = rq.result;
          if (!db.objectStoreNames.contains(PDF_STORE)) db.createObjectStore(PDF_STORE);
          if (!db.objectStoreNames.contains(ASSET_STORE)) db.createObjectStore(ASSET_STORE);
        };
        rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
      });
    }
    async function pdfCacheGet(id) {
      try {
        const db = await idbOpen();
        return await new Promise((res) => {
          const rq = db.transaction(PDF_STORE, "readonly").objectStore(PDF_STORE).get(id);
          rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
        });
      } catch (e) { return null; }
    }
    async function pdfCachePut(id, buf) {
      try {
        const db = await idbOpen();
        const st = db.transaction(PDF_STORE, "readwrite").objectStore(PDF_STORE);
        st.put({ buf, ts: Date.now() }, id);
      } catch (e) { /* quota 초과 등 무시 */ }
    }

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }
    const fail = (msg) => {
      document.getElementById("host").innerHTML =
        `<div class="v2-msg v2-err">${msg}</div>`;
    };

    /* ── 상태 ── */
    let REPORT = null;         // reports.json 항목
    let READTEXT = null;       // text/<id>.json 의 pages — 읽기 모드 본문
    let readingBuilt = false;
    let mode = "pdf";          // pdf | reading
    let llmEngine = null, llmQueued = false, llmChecked = false, llmPoll = null;
    const _pageImgCache = {};
    let highlights = [];       // 기존 스키마 그대로
    let annoSha = null;
    const deletedHids = new Set();
    const idMap = new Map();   // EmbedPDF annotation id -> hid
    let pageSizes = [];        // pageIndex -> {width,height} (PDF 포인트)
    let lastSelection = null;  // {text, segs} — 하이라이트 생성 직전의 선택 텍스트
    let saveTimer = null;

    /* 기존(정규화) → EmbedPDF(PDF 포인트) */
    function toSegRects(rects, size) {
      return rects.map((r) => ({
        origin: { x: r.x * size.width, y: r.y * size.height },
        size: { width: r.w * size.width, height: r.h * size.height },
      }));
    }
    const boundOf = (segs) => {
      const x1 = Math.min(...segs.map((s) => s.origin.x));
      const y1 = Math.min(...segs.map((s) => s.origin.y));
      const x2 = Math.max(...segs.map((s) => s.origin.x + s.size.width));
      const y2 = Math.max(...segs.map((s) => s.origin.y + s.size.height));
      return { origin: { x: x1, y: y1 }, size: { width: x2 - x1, height: y2 - y1 } };
    };
    /* EmbedPDF(PDF 포인트) → 기존(정규화) */
    function toNormRects(segs, size) {
      return (segs || []).map((s) => ({
        x: s.origin.x / size.width,       y: s.origin.y / size.height,
        w: s.size.width / size.width,     h: s.size.height / size.height,
      }));
    }

    async function persist() {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        try {
          const r = await saveAnnotations(REPORT_ID, highlights, [...deletedHids], annoSha);
          annoSha = r.sha; highlights = r.highlights;
          deletedHids.clear();
          document.getElementById("hlCount").textContent = `${highlights.length}개`;
          bumpCount(REPORT_ID, highlights.length);
          if (readingBuilt) {                            // 읽기 화면에도 반영
            renderReadingMarks();
            document.querySelectorAll("#readingContainer .rd-pageimg").forEach(
              (w) => renderReadImgBoxes(parseInt(w.dataset.page, 10)));
          }
        } catch (e) {
          toast("저장 실패: " + (e.message || e));
        }
      }, 600);   // 연속 편집을 한 번에 묶어 저장(기존 뷰어와 같은 취지)
    }

    /* ═══ 읽기 모드 ═══════════════════════════════════════
       엔진과 무관하다 — 수집 때 PyMuPDF로 뽑아둔 본문(text/<id>.json)과
       사전 렌더 페이지 이미지(pages/<id>/n.jpg)만 쓴다. v1과 같은 CSS 클래스를 쓴다. */
    const esc = (s) => (s == null ? "" : String(s)).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    /* 버튼 라벨 갈아끼우기 — 아이콘은 그대로, 글자만 .btn-txt 로 감싼다.
       textContent 로 통째로 바꾸면 span 이 날아가 좁은 화면에서 라벨이 다시 튀어나온다. */
    function setBtnLabel(el, icon, text) {
      el.textContent = icon;
      const s = document.createElement("span");
      s.className = "btn-txt";
      s.textContent = " " + text;
      el.appendChild(s);
    }

    async function idbAsset(key, val) {
      try {
        const db = await idbOpen();
        if (val === undefined) {
          return await new Promise((res) => {
            const rq = db.transaction(ASSET_STORE, "readonly").objectStore(ASSET_STORE).get(key);
            rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null);
          });
        }
        db.transaction(ASSET_STORE, "readwrite").objectStore(ASSET_STORE).put({ val, ts: Date.now() }, key);
      } catch (e) { return null; }
    }

    /* 페이지 이미지는 vault(비공개)라 인증 fetch → objectURL. id 기준 불변이라 영구 캐시. */
    async function loadPageImage(n) {
      if (_pageImgCache[n]) return _pageImgCache[n];
      const key = "img:" + REPORT_ID + "/" + n;
      let blob = null;
      const hit = await idbAsset(key);
      if (hit && hit.val) blob = hit.val;
      if (!blob) {
        const res = await ghFetch("contents/" + REPORT.pages_dir + "/" + n + ".jpg",
                                  { accept: "application/vnd.github.raw" });
        if (!res.ok) throw new Error("page image " + n + " " + res.status);
        blob = await res.blob();
        idbAsset(key, blob);
      }
      const url = URL.createObjectURL(blob);
      _pageImgCache[n] = url;
      return url;
    }

    function buildReadingView() {
      const rd = document.getElementById("readingContainer");
      rd.innerHTML = "";
      const total = REPORT.pages || 0;
      for (let n = 1; n <= total; n++) {
        let html = `<div class="rd-pageno">p.${n}</div>`;
        html += `<div class="rd-pageimg" data-page="${n}" style="min-height:200px"></div>`;
        for (const b of (READTEXT ? (READTEXT[String(n)] || []) : [])) {
          if (b.kind === "sub") html += `<h3 class="rd-h rd-sub">${esc(b.text)}</h3>`;
          else if (b.kind !== "p") html += `<h3 class="rd-h">${esc(b.text)}</h3>`;
          else html += `<p class="rd-para">${esc(b.text)}</p>`;
        }
        rd.insertAdjacentHTML("beforeend", `<div class="rd-page" data-page="${n}">${html}</div>`);
      }
      // 페이지 이미지는 뷰포트 근처에 오면 그때 받는다(전 페이지 선다운로드 방지)
      const io = new IntersectionObserver((ents, obs) => {
        for (const en of ents) {
          if (!en.isIntersecting) continue;
          obs.unobserve(en.target);
          const n = parseInt(en.target.dataset.page, 10);
          loadPageImage(n).then((url) => {
            en.target.innerHTML = `<img class="rd-pagecanvas" src="${url}" alt="p.${n}">`;
            en.target.style.minHeight = "";
            renderReadImgBoxes(n);
          }).catch(() => { en.target.innerHTML = `<div class="v2-msg">이미지 로드 실패</div>`; });
        }
      }, { rootMargin: "800px 0px" });
      rd.querySelectorAll(".rd-pageimg").forEach((w) => io.observe(w));
    }

    /* 기존 하이라이트를 읽기 본문 위에 <mark>로 표시.
       ★ 공백을 지우고 맞춘다 — PDF에서 딴 하이라이트 텍스트와 수집 때 PyMuPDF가 뽑은 본문은
         띄어쓰기가 다르다("① 고연차" vs "①고연차"). 그대로 indexOf 하면 하나도 안 맞는다. */
    function markNeedle(page, raw, color) {
      const needle = (raw || "").replace(/\s+/g, "");
      if (needle.length < 4) return false;
      for (const el of page.querySelectorAll(".rd-para, .rd-h")) {
        // 블록 안 텍스트 노드를 이어붙이며 (노드, 오프셋) 지도를 만든다
        const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
        let stripped = "", map = [], node;
        while ((node = walker.nextNode())) {
          if (node.parentNode && node.parentNode.tagName === "MARK") continue;   // 이미 칠한 곳은 건너뛴다
          const v = node.nodeValue;
          for (let i = 0; i < v.length; i++) {
            if (/\s/.test(v[i])) continue;
            stripped += v[i]; map.push([node, i]);
          }
        }
        const at = stripped.indexOf(needle);
        if (at < 0) continue;
        const [sNode, sOff] = map[at];
        const [eNode, eOff] = map[at + needle.length - 1];
        const r = document.createRange();
        r.setStart(sNode, sOff); r.setEnd(eNode, eOff + 1);
        const mk = document.createElement("mark");
        mk.className = "rd-mark " + (color || "yellow");
        try {
          r.surroundContents(mk);
        } catch (e) {
          try { mk.appendChild(r.extractContents()); r.insertNode(mk); } catch (e2) { continue; }
        }
        return true;
      }
      return false;
    }

    function renderReadingMarks() {
      const rd = document.getElementById("readingContainer");
      rd.querySelectorAll("mark.rd-mark").forEach((m) => {
        m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
      });
      rd.querySelectorAll(".rd-page").forEach((p) => p.normalize());
      for (const hl of highlights) {
        if (hl.type === "image") continue;
        const page = rd.querySelector(`.rd-page[data-page="${hl.page}"]`);
        if (!page) continue;
        const parts = (hl.segs && hl.segs.length ? hl.segs : [hl.text]).filter(Boolean);
        for (const part of parts) {
          if (markNeedle(page, part, hl.color)) continue;
          // 통째로 못 찾으면 두 문단에 걸친 선택이다 → 문장 단위로 쪼개 각각 시도
          const chunks = part.split(/(?<=[.!?。])\s+/).filter((c) => c.replace(/\s+/g, "").length >= 4);
          if (chunks.length > 1) for (const c of chunks) markNeedle(page, c, hl.color);
        }
      }
    }

    /* 캡처(type=image)는 페이지 이미지 위 박스로 표시 — 정규 좌표라 크기 무관 */
    function renderReadImgBoxes(pageNo) {
      const wrap = document.querySelector(`#readingContainer .rd-pageimg[data-page="${pageNo}"]`);
      if (!wrap || !wrap.querySelector("img.rd-pagecanvas")) return;
      wrap.querySelectorAll(".rd-imgbox").forEach((el) => el.remove());
      for (const hl of highlights) {
        if (hl.type !== "image" || hl.page !== pageNo) continue;
        for (const r of hl.rects || []) {
          const div = document.createElement("div");
          div.className = "rd-imgbox " + (hl.color || "yellow");
          div.style.cssText = `left:${r.x * 100}%;top:${r.y * 100}%;width:${r.w * 100}%;height:${r.h * 100}%`;
          div.dataset.hid = hl.hid;
          wrap.appendChild(div);
        }
      }
    }

    async function setMode(m) {
      mode = m;
      const rd = document.getElementById("readingContainer");
      const btn = document.getElementById("modeBtn");
      if (m === "reading") {
        if (!readingBuilt) {
          rd.innerHTML = `<div class="v2-msg">읽기 화면 구성 중…</div>`;
          rd.style.display = "";
          document.body.classList.add("reading-on");
          buildReadingView();
          readingBuilt = true;
        } else {
          rd.style.display = ""; document.body.classList.add("reading-on");
        }
        renderReadingMarks();
        setBtnLabel(btn, "📄", "PDF");
        document.getElementById("llmBtn").style.display = "";
        document.getElementById("ttsBtn").style.display = "";
        ttsBlocks = [];                 // 본문이 막 만들어졌을 수 있다 → 재생할 때 다시 훑는다
        renderTtsUI();
        ensureLlmState();
      } else {
        rd.style.display = "none";
        document.body.classList.remove("reading-on");
        setBtnLabel(btn, "📖", "읽기");
        document.getElementById("llmBtn").style.display = "none";
        document.getElementById("ttsBtn").style.display = "none";
        // PDF 모드엔 읽을 본문 DOM이 없다 — 소리만 계속 나면 이상하다
        if (ttsOn) ttsStop(true);
      }
      window.scrollTo(0, 0);
    }

    /* ═══ 온디맨드 LLM 본문 재추출 (v1과 같은 큐를 쓴다) ═══ */
    const LLM_REQ = "contents/index/llm_requests.json";
    /* 글자 레이어가 없는 통짜 이미지 PDF.
       LLM 정리는 PDF에서 뽑은 '텍스트'를 다듬는 것이라 여기선 뽑을 원문이 없다 —
       눌러봐야 빈 결과만 나오므로 아예 막고 이유를 알린다. */
    const isImageOnly = () => REPORT && REPORT.has_text_layer === false;

    function renderLlmBtn() {
      const b = document.getElementById("llmBtn");
      if (isImageOnly()) { setBtnLabel(b, "🚫", "이미지 PDF"); b.disabled = true; b.title = "글자 레이어가 없는 이미지 PDF라 본문 추출이 안 됩니다"; return; }
      if (llmQueued) { setBtnLabel(b, "⏳", "처리 대기중"); b.disabled = true; }
      else if (llmEngine === "llm") { setBtnLabel(b, "✅", "LLM 본문"); b.disabled = false; }
      else { setBtnLabel(b, "🤖", "LLM 정리"); b.disabled = false; }
    }
    async function llmPending() {
      try {
        const res = await ghFetch(LLM_REQ, { cache: "no-store" });
        if (!res.ok) return [];
        return (JSON.parse(decodeB64Utf8((await res.json()).content)).pending) || [];
      } catch (e) { return []; }
    }
    async function requestLlm() {
      for (let a = 0; a < 4; a++) {
        const res = await ghFetch(LLM_REQ, { cache: "no-store" });
        let doc = { pending: [], done: [] }, sha = null;
        if (res.ok) { const obj = await res.json(); doc = JSON.parse(decodeB64Utf8(obj.content)); sha = obj.sha; }
        doc.pending = doc.pending || [];
        if (!doc.pending.some((p) => (p.id || p) === REPORT_ID)) doc.pending.push({ id: REPORT_ID, requested_at: nowKst() });
        const body = { message: `llm-req: ${REPORT_ID}`, content: encodeUtf8B64(JSON.stringify(doc, null, 2)) };
        if (sha) body.sha = sha;
        const put = await ghFetch(LLM_REQ, { method: "PUT", body });
        if (put.ok) return;
        if (put.status !== 409 && put.status !== 422) throw new Error("요청 실패 " + put.status);
      }
      throw new Error("요청 충돌(잠시 후 다시)");
    }
    function startLlmPoll() {
      clearInterval(llmPoll);
      llmPoll = setInterval(async () => {
        const pend = await llmPending();
        if (pend.some((p) => (p.id || p) === REPORT_ID)) return;
        clearInterval(llmPoll);
        llmQueued = false;
        renderLlmBtn();
        toast("본문 정리 완료 — 새로고침하면 반영됩니다");
      }, 25000);
    }
    async function ensureLlmState() {
      renderLlmBtn();
      if (llmChecked) return;
      llmChecked = true;
      llmQueued = (await llmPending()).some((p) => (p.id || p) === REPORT_ID);
      renderLlmBtn();
      if (llmQueued) startLlmPoll();
    }

    /* ═══ 리포트 삭제 ═══════════════════════════════════
       목록(index.html)의 삭제와 같은 규약이다 — reports.json 에서 항목을 빼고
       deleted 에 id 를 남기면 서버 prune 이 pdf·clips·pages 파일을 정리한다.
       (읽는 도중에 "이건 아니다" 싶을 때 목록으로 되돌아가지 않아도 되게 여기에도 둔다) */
    async function deleteThisReport() {
      for (let attempt = 0; attempt < 3; attempt++) {
        const res = await ghFetch("contents/index/reports.json", { cache: "no-store" });
        if (!res.ok) throw new Error("목록 로드 실패: " + res.status);
        const obj = await res.json();
        const doc = JSON.parse(decodeB64Utf8(obj.content));
        doc.reports = (doc.reports || []).filter((r) => r.id !== REPORT_ID);
        doc.deleted = Array.from(new Set([...(doc.deleted || []), REPORT_ID]));
        const put = await ghFetch("contents/index/reports.json", {
          method: "PUT",
          body: {
            message: `delete: ${REPORT_ID}`,
            content: encodeUtf8B64(JSON.stringify(doc, null, 2)),
            sha: obj.sha,
          },
        });
        if (put.ok) return;
        // 다른 기기가 먼저 목록을 고친 경우다 → 최신본으로 다시(sha 충돌)
        if (put.status !== 409 && put.status !== 422) throw new Error("삭제 실패: " + put.status);
      }
      throw new Error("삭제 충돌(잠시 후 다시)");
    }

    document.getElementById("delReportBtn").onclick = async () => {
      const name = (REPORT && REPORT.title) || REPORT_ID;
      if (!confirm(`"${name}" 리포트를 삭제할까요?\n하이라이트·캡처도 함께 삭제됩니다. (Notion 기록은 보존)`)) return;
      const b = document.getElementById("delReportBtn");
      b.disabled = true; b.textContent = "…";
      try {
        clearTimeout(saveTimer);          // 삭제하는데 하이라이트를 되살려 저장하면 곤란하다
        await deleteThisReport();
        try {
          localStorage.removeItem("rv_thumb_" + REPORT_ID);
          localStorage.removeItem(LASTPAGE_KEY);
        } catch (e) {}
        location.replace("index.html");   // 지워진 리포트로 뒤로가기 되지 않게 replace
      } catch (e) {
        b.disabled = false; b.textContent = "🗑";
        toast(e.message || "삭제 실패");
      }
    };

    /* ═══ 본문 낭독(TTS) ═══════════════════════════════
       브라우저 내장 음성(speechSynthesis)만 쓴다 — 키도 비용도 없다.

       ★ LLM으로 정리된 본문일 때만 읽는다.
         규칙 기반(heuristic) 추출본은 2단 조판 때문에 문장이 컬럼 끝에서 잘려
         "…누적된 엔화 국채금리" / "안정하고 흐름의 추세 전환은…" 처럼 토막나 있다.
         눈으로 볼 땐 넘어가지지만 소리로 들으면 못 알아듣는다. */
    const TTS_MIN_LEN = 60, TTS_MIN_BLOCKS = 5;
    /* 한 번에 읽히는 길이. 크롬은 긴 문장 하나를 15초쯤에서 조용히 끊어버려서
       문장 단위로 잘라 짧게 넘긴다(끊김 대신 자연스러운 쉼표가 된다). */
    const TTS_CHUNK = 140;
    const TTS_RATES = [1.0, 1.25, 1.5];
    /* 사람이 읽듯 끊어 준다. 붙여 읽으면 내용은 같아도 기계처럼 들린다. */
    const TTS_GAP_SENT = 200;    // 문장 사이
    const TTS_GAP_PARA = 480;    // 문단 사이
    const TTS_GAP_HEAD = 620;    // 소제목 뒤
    const TTS_VOICE_KEY = "rv_tts_voice";
    let ttsBlocks = [], ttsIdx = -1, ttsOn = false, ttsPaused = false;
    let ttsGen = 0, ttsRateI = 0, ttsVoice = null, ttsVoices = [];
    const synth = window.speechSynthesis;

    /* 목소리 고르기.
       ★ 기본값을 '네트워크 음성 우선'으로 둔다. 예전엔 한국어 첫 번째를 그냥 집었는데,
         목록 앞쪽은 보통 OS 내장 음성(윈도우10이면 Microsoft Heami)이라 신경망 이전
         세대 목소리가 걸렸다. 크롬이 주는 'Google 한국의' 음성이 훨씬 자연스럽다.
       목록은 크롬에서 비동기로 온다 — 늦게 와도 onvoiceschanged 로 다시 고른다. */
    function pickVoice() {
      try {
        const all = synth.getVoices() || [];
        ttsVoices = all.filter((v) => /^ko/i.test(v.lang));
        const saved = localStorage.getItem(TTS_VOICE_KEY);
        ttsVoice = (saved && ttsVoices.find((v) => v.voiceURI === saved))
          || ttsVoices.find((v) => !v.localService)     // 네트워크(구글) 음성
          || ttsVoices[0] || null;
        renderVoiceSel();
      } catch (e) {}
    }
    function renderVoiceSel() {
      const sel = document.getElementById("ttsVoice");
      if (!sel) return;
      // 고를 게 하나뿐이면 메뉴를 띄울 이유가 없다
      sel.style.display = ttsVoices.length > 1 ? "" : "none";
      if (sel.dataset.n === String(ttsVoices.length)) { if (ttsVoice) sel.value = ttsVoice.voiceURI; return; }
      sel.dataset.n = String(ttsVoices.length);
      sel.innerHTML = "";
      for (const v of ttsVoices) {
        const o = document.createElement("option");
        o.value = v.voiceURI;
        o.textContent = v.name.replace(/^Microsoft\s+/, "").replace(/\s+Desktop$/, "");
        sel.appendChild(o);
      }
      if (ttsVoice) sel.value = ttsVoice.voiceURI;
    }
    if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }

    /* 읽을 때만 바꾸는 표기 — 화면 글자는 그대로 둔다.
       리포트에 흔한 약어·기호를 그대로 읽히면 "와이오와이", "가운뎃점"처럼 나온다. */
    const TTS_SAY = [
      [/·/g, ", "],                                    // 제조·금융·데이터센터 → 끊어 읽기
      [/\bYoY\b/gi, "전년 대비"], [/\bQoQ\b/gi, "전분기 대비"], [/\bMoM\b/gi, "전월 대비"],
      [/%p\b/g, "퍼센트포인트"], [/\bbp\b/g, "베이시스포인트"],
      [/(\d)\s*~\s*(\d)/g, "$1에서 $2"],
    ];
    const ttsSay = (s) => TTS_SAY.reduce((t, [re, to]) => t.replace(re, to), s);

    /* 읽을 만한 본문인지 — 엔진 태그만 믿지 않는다.
       text_engine 이 llm 인데 추출이 실패해 블록이 몇 개뿐인 리포트가 실제로 있다. */
    function ttsEligible() {
      if (!synth || !READTEXT || llmEngine !== "llm") return false;
      let n = 0;
      for (const k of Object.keys(READTEXT)) {
        for (const b of READTEXT[k] || []) {
          if ((b.text || "").length >= TTS_MIN_LEN && ++n >= TTS_MIN_BLOCKS) return true;
        }
      }
      return false;
    }

    function ttsChunks(text) {
      const s = (text || "").replace(/\s+/g, " ").trim();
      const out = [];
      let cur = "";
      for (const part of s.split(/(?<=[.!?。？！])\s+/)) {
        if (cur && (cur + " " + part).length > TTS_CHUNK) { out.push(cur); cur = part; }
        else cur = cur ? cur + " " + part : part;
      }
      if (cur) out.push(cur);
      /* 마침표 없이 긴 문단(불릿·표제형 문장)은 위에서 안 잘린다.
         글자 수로 뚝 자르면 말이 중간에서 끊기니, 쉼표 같은 절 경계를 먼저 노린다. */
      return out.flatMap((c) => {
        if (c.length <= TTS_CHUNK * 1.15) return [c];
        const parts = [];
        let buf = "";
        for (const cl of c.split(/(?<=[,;·、])\s*/)) {
          if (buf && (buf + cl).length > TTS_CHUNK) { parts.push(buf.trim()); buf = cl; }
          else buf += cl;
        }
        if (buf.trim()) parts.push(buf.trim());
        // 절 경계조차 없으면 그때야 글자 수로 자른다
        return parts.flatMap((p) => {
          if (p.length <= TTS_CHUNK * 1.15) return [p];
          const hard = [];
          for (let i = 0; i < p.length; i += TTS_CHUNK) hard.push(p.slice(i, i + TTS_CHUNK));
          return hard;
        });
      });
    }

    function ttsMark(el) {
      document.querySelectorAll("#readingContainer .tts-now").forEach((e) => e.classList.remove("tts-now"));
      if (!el) return;
      el.classList.add("tts-now");
      // 화면 안에 편하게 들어와 있으면 굳이 움직이지 않는다(읽는 중 화면이 계속 튀지 않게)
      const r = el.getBoundingClientRect();
      if (r.top < 80 || r.bottom > window.innerHeight - 80) {
        el.scrollIntoView({ block: "center", behavior: "smooth" });
      }
    }

    function ttsCollect() {
      ttsBlocks = [...document.querySelectorAll(
        "#readingContainer .rd-h, #readingContainer .rd-para")]
        .filter((el) => (el.textContent || "").trim().length >= 2);
    }

    function renderTtsUI() {
      const btn = document.getElementById("ttsBtn");
      const bar = document.getElementById("ttsBar");
      const ok = ttsEligible();
      btn.classList.toggle("tts-off", !ok);
      btn.textContent = ttsOn && !ttsPaused ? "🔊…" : "🔊";
      bar.style.display = ttsOn ? "" : "none";
      document.getElementById("ttsPlay").textContent = ttsPaused ? "▶" : "⏸";
      document.getElementById("ttsRate").textContent = TTS_RATES[ttsRateI].toFixed(2).replace(/0$/, "") + "×";
    }

    function ttsStop(quiet) {
      ttsGen++;                       // 진행 중이던 콜백 사슬을 끊는다
      ttsOn = false; ttsPaused = false; ttsIdx = -1;
      try { synth && synth.cancel(); } catch (e) {}
      ttsMark(null);
      renderTtsUI();
      if (!quiet) toast("낭독 끝");
    }

    function ttsPlayFrom(i) {
      if (!ttsBlocks.length) ttsCollect();
      if (!ttsBlocks.length) { toast("읽을 본문이 없습니다"); return; }
      const gen = ++ttsGen;           // 이전 재생과 겹치지 않게(문단 점프·속도 변경 시)
      try { synth.cancel(); } catch (e) {}
      ttsOn = true; ttsPaused = false;
      const step = (idx) => {
        if (gen !== ttsGen) return;
        if (idx < 0) idx = 0;
        if (idx >= ttsBlocks.length) { ttsStop(true); toast("끝까지 읽었습니다"); return; }
        ttsIdx = idx;
        const el = ttsBlocks[idx];
        ttsMark(el);
        const isHead = el.classList.contains("rd-h");
        const chunks = ttsChunks(el.textContent);
        let c = 0;
        const next = () => {
          if (gen !== ttsGen) return;
          if (c >= chunks.length) {
            // 제목 뒤엔 더 쉰다 — 붙여 읽으면 어디가 소제목인지 안 들린다
            setTimeout(() => step(idx + 1), isHead ? TTS_GAP_HEAD : TTS_GAP_PARA);
            return;
          }
          const u = new SpeechSynthesisUtterance(ttsSay(chunks[c++]));
          u.lang = "ko-KR";
          u.rate = TTS_RATES[ttsRateI];
          if (ttsVoice) u.voice = ttsVoice;
          // 문장 사이에 숨을 넣는다. 곧바로 이으면 한 문장처럼 밀려 나온다
          u.onend = () => setTimeout(next, TTS_GAP_SENT);
          u.onerror = () => setTimeout(next, TTS_GAP_SENT);   // 한 토막 실패로 전체가 멈추지 않게
          synth.speak(u);
        };
        next();
      };
      step(i);
      renderTtsUI();
    }

    document.getElementById("ttsBtn").onclick = () => {
      if (!synth) { toast("이 브라우저는 음성 읽기를 지원하지 않습니다"); return; }
      if (!ttsEligible()) {
        toast(llmEngine === "llm" ? "읽을 만한 본문이 없습니다 — 🤖 LLM 정리를 다시 눌러주세요"
                                  : "먼저 🤖 LLM 정리를 눌러주세요 (원문 그대로는 문장이 잘려 있습니다)");
        return;
      }
      if (ttsOn) { ttsStop(); return; }
      ttsCollect();
      // 화면에 보이는 첫 문단부터 읽는다 — 스크롤해 둔 자리를 무시하고 1페이지로 돌아가면 곤란하다
      const at = ttsBlocks.findIndex((el) => el.getBoundingClientRect().bottom > 90);
      ttsPlayFrom(at < 0 ? 0 : at);
    };
    document.getElementById("ttsPlay").onclick = () => {
      if (!ttsOn) return;
      if (ttsPaused) { synth.resume(); ttsPaused = false; }
      else { synth.pause(); ttsPaused = true; }
      renderTtsUI();
    };
    document.getElementById("ttsPrev").onclick = () => ttsOn && ttsPlayFrom(Math.max(0, ttsIdx - 1));
    document.getElementById("ttsNext").onclick = () => ttsOn && ttsPlayFrom(ttsIdx + 1);
    document.getElementById("ttsRate").onclick = () => {
      ttsRateI = (ttsRateI + 1) % TTS_RATES.length;
      renderTtsUI();
      if (ttsOn) ttsPlayFrom(ttsIdx);   // 속도는 재생 중 못 바꾼다 → 현재 문단을 새 속도로 다시
    };
    document.getElementById("ttsVoice").onchange = (e) => {
      const v = ttsVoices.find((x) => x.voiceURI === e.target.value);
      if (!v) return;
      ttsVoice = v;
      try { localStorage.setItem(TTS_VOICE_KEY, v.voiceURI); } catch (err) {}
      if (ttsOn) ttsPlayFrom(ttsIdx);   // 목소리도 재생 중엔 안 바뀐다 → 현재 문단부터 새 목소리로
      else toast("목소리: " + v.name);
    };
    document.getElementById("ttsClose").onclick = () => ttsStop();

    /* 낭독 중 문단을 탭하면 그 문단부터. 낭독이 꺼져 있을 땐 가로채지 않는다(글 선택 방해 금지) */
    document.getElementById("readingContainer").addEventListener("click", (e) => {
      if (!ttsOn) return;
      if (window.getSelection && String(window.getSelection()).length > 1) return;   // 글 선택 중
      const el = e.target.closest && e.target.closest(".rd-para, .rd-h");
      if (!el) return;
      const at = ttsBlocks.indexOf(el);
      if (at >= 0) ttsPlayFrom(at);
    });

    // 탭을 닫거나 뒤로 가도 목소리가 계속 남는 브라우저가 있다
    window.addEventListener("pagehide", () => { try { synth && synth.cancel(); } catch (e) {} });

    document.getElementById("modeBtn").onclick = () => setMode(mode === "pdf" ? "reading" : "pdf");
    document.getElementById("llmBtn").onclick = async () => {
      if (isImageOnly()) {
        // 그림으로 읽어둔 본문이 이미 있는 경우와, 본문 자체가 없는 경우를 구분해 알린다
        toast(READTEXT ? "이미지 PDF라 LLM 정리는 안 됩니다 — 본문은 그림으로 읽어둔 것입니다"
                       : "이미지 PDF라 본문 추출이 안 됩니다 — PDF 모드로 보세요");
        return;
      }
      if (llmQueued) return;
      if (llmEngine === "llm" && !confirm("이미 LLM으로 정리된 본문이에요. 다시 요청할까요?")) return;
      const b = document.getElementById("llmBtn"); b.disabled = true;
      try {
        await requestLlm();
        llmQueued = true; renderLlmBtn();
        toast("요청됨 · 몇 분 내 반영됩니다");
        startLlmPoll();
      } catch (e) { toast(e.message || "요청 실패"); renderLlmBtn(); }
    };

    async function start() {
      if (!REPORT_ID) return fail("리포트 id가 없습니다. index.html에서 열어주세요.");
      document.getElementById("hlLink").href = "highlights.html?id=" + encodeURIComponent(REPORT_ID);

      let report, anno;
      try {
        const [reportsDoc, a] = await Promise.all([loadReports(), loadAnnotations(REPORT_ID)]);
        report = (reportsDoc.reports || []).find((r) => r.id === REPORT_ID);
        anno = a;
      } catch (e) { return fail("불러오기 실패: " + (e.message || e)); }
      if (!report) return fail("리포트를 찾을 수 없습니다: " + REPORT_ID);

      REPORT = report;
      llmEngine = report.text_engine || null;
      document.getElementById("docTitle").textContent = report.title || REPORT_ID;
      document.title = (report.title || "리포트 뷰어") + " · v2";
      highlights = anno.data.highlights || [];
      annoSha = anno.sha;
      document.getElementById("hlCount").textContent = `${highlights.length}개`;

      // 읽기 모드용 본문(있으면). 실패해도 PDF 모드는 정상 동작한다.
      if (report.text_path) {
        try {
          const res = await ghFetch("contents/" + report.text_path,
                                    { accept: "application/vnd.github.raw", cache: "no-store" });
          if (res.ok) { const td = await res.json(); READTEXT = td && td.pages ? td.pages : null; }
        } catch (e) { READTEXT = null; }
      }
      if (!READTEXT || !report.pages_dir) document.getElementById("modeBtn").style.display = "none";

      // PDF 확보(캐시 우선)
      let buf;
      try {
        const hit = await pdfCacheGet(REPORT_ID);
        if (hit && hit.buf) buf = hit.buf;
        else { buf = await loadPdf(report.pdf_path); pdfCachePut(REPORT_ID, buf.slice(0)); }
      } catch (e) { return fail("PDF 로드 실패: " + (e.message || e)); }

      const host = document.getElementById("host");
      host.innerHTML = "";
      const box = document.createElement("div");
      host.appendChild(box);
      const src = URL.createObjectURL(new Blob([buf], { type: "application/pdf" }));
      const viewer = EmbedPDF.init({ type: "container", target: box, src });

      const registry = await viewer.registry;
      const annoApi = registry.getPlugin("annotation").provides();
      const docApi  = registry.getPlugin("document-manager").provides();
      const selApi  = registry.getPlugin("selection").provides();

      // 문서가 실제로 열릴 때까지 기다린다.
      // ★ 이걸 안 하고 바로 주석을 넣으면 조용히 유실된다(검증에서 7개 중 1개만 남았다).
      const doc = await new Promise((res) => {
        const now = docApi.getActiveDocument && docApi.getActiveDocument();
        if (now && now.pages) return res(now);
        const off = docApi.onDocumentOpened((d) => { off && off(); res(d && d.pages ? d : docApi.getActiveDocument()); });
        setTimeout(() => res(docApi.getActiveDocument()), 15000);
      });
      if (!doc || !doc.pages) return fail("PDF를 여는 데 실패했습니다.");
      pageSizes = doc.pages.map((p) => p.size);

      // 선택 텍스트 기억 — 새 하이라이트의 text/segs 로 쓴다
      if (selApi.onSelectionChange) {
        selApi.onSelectionChange(() => {
          try {
            const t = selApi.getSelectedText && selApi.getSelectedText();
            const done = (v) => {
              const arr = Array.isArray(v) ? v : (typeof v === "string" ? [v] : []);
              const segs = arr.filter(Boolean);
              if (segs.length) lastSelection = { text: segs.join(" ").trim(), segs };
            };
            (t && t.wait) ? t.wait(done, () => {}) : done(t);
          } catch (e) { /* 선택 텍스트는 없어도 하이라이트는 만든다 */ }
        });
      }

      // 기존 하이라이트 표시 — 하나씩, 간격을 두고(대량 import는 내부 렌더 에러가 난다)
      let shown = 0;
      for (const h of highlights) {
        const pi = (h.page || 1) - 1;
        const size = pageSizes[pi];
        if (!size || !Array.isArray(h.rects) || !h.rects.length) continue;
        const segs = toSegRects(h.rects, size);
        try {
          if (h.type === "image") {
            // 캡처 영역은 테두리 사각형으로 표시(v1의 페이지 위 박스 대응).
            // ★ strokeStyle 이 빠지면 store 에는 들어가는데 화면에 안 그려진다.
            annoApi.createAnnotation(pi, {
              type: SQ, pageIndex: pi, id: h.hid, rect: boundOf(segs),
              color: "transparent", opacity: 1, strokeWidth: 3,
              strokeColor: COLOR_HEX[h.color] || COLOR_HEX.yellow, strokeStyle: 1,
            });
          } else {
            annoApi.createAnnotation(pi, {
              type: HL, pageIndex: pi, id: h.hid,
              rect: boundOf(segs), segmentRects: segs,
              color: COLOR_HEX[h.color] || COLOR_HEX.yellow,
              opacity: 0.45, contents: h.text || "",
            });
          }
          idMap.set(h.hid, h.hid);
          shown++;
        } catch (e) { /* 개별 실패는 건너뛴다 */ }
        await new Promise((r) => setTimeout(r, 60));
      }
      if (shown) toast(`하이라이트 ${shown}개 표시`);

      /* ═══ 영역 캡처 — EmbedPDF CapturePlugin ═══════════
         v1은 캡처 UI를 직접 만들었지만 여기선 플러그인의 마퀴 선택을 쓴다.
         결과 blob은 PNG라서, 기존 파이프라인(clips/<id>/<hid>.jpg)에 맞춰 JPEG로 바꿔 올린다. */
      const capApi = registry.getPlugin("capture").provides();
      const capBtn = document.getElementById("capBtn");
      capBtn.onclick = () => {
        capApi.toggleMarqueeCapture();
        const on = capApi.isMarqueeCaptureActive && capApi.isMarqueeCaptureActive();
        capBtn.classList.toggle("active", !!on);
        toast(on ? "드래그로 영역을 선택하세요" : "캡처 모드 해제");
      };

      const toJpeg = (blob) => new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => {
          const cv = document.createElement("canvas");
          cv.width = img.naturalWidth; cv.height = img.naturalHeight;
          const ctx = cv.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, cv.width, cv.height);   // JPEG는 알파 없음
          ctx.drawImage(img, 0, 0);
          URL.revokeObjectURL(img.src);
          cv.toBlob((b) => b ? res(b) : rej(new Error("jpeg 변환 실패")), "image/jpeg", 0.85);
        };
        img.onerror = () => rej(new Error("캡처 이미지 로드 실패"));
        img.src = URL.createObjectURL(blob);
      });

      capApi.onCaptureArea(async (ev) => {
        try {
          const pi = ev.pageIndex, size = pageSizes[pi];
          if (!size || !ev.blob) return;
          const r = ev.rect;
          const hid = "h_" + Date.now();
          const clip = `clips/${REPORT_ID}/${hid}.jpg`;
          const hl = { hid, page: pi + 1, type: "image", clip, color: "yellow",
            rects: [{ x: r.origin.x / size.width, y: r.origin.y / size.height,
                      w: r.size.width / size.width, h: r.size.height / size.height }],
            created_at: nowKst() };
          highlights.push(hl);                       // 낙관적 반영(업로드 전에도 개수에 보임)
          document.getElementById("hlCount").textContent = `${highlights.length}개`;
          toast("캡처 저장 중…");
          try {
            await putBinaryFile(clip, await toJpeg(ev.blob), `clip: ${REPORT_ID} ${hid}`);
            // 캡처한 자리에 테두리를 남겨 어디를 떴는지 PDF에서도 보이게 한다
            annoApi.createAnnotation(pi, {
              type: SQ, pageIndex: pi, id: hid, rect: r,
              color: "transparent", opacity: 1, strokeWidth: 3,
              strokeColor: COLOR_HEX[hl.color] || COLOR_HEX.yellow, strokeStyle: 1,
            });
            idMap.set(hid, hid);
            persist();
            toast("✂️ 캡처됨 · 모아보기에서 확인");
          } catch (e) {
            highlights = highlights.filter((h) => h.hid !== hid);   // 업로드 실패 → 롤백
            document.getElementById("hlCount").textContent = `${highlights.length}개`;
            toast("캡처 저장 실패 — 다시 시도해 주세요");
          }
          capBtn.classList.remove("active");         // 한 번 캡처하면 모드 해제(v1과 동일)
        } catch (e) { toast("캡처 실패: " + (e.message || e)); }
      });

      /* 딥링크 처리 — 목록의 '읽기로 열기', 모아보기의 '이 하이라이트로 점프' */
      const scrollApi = registry.getPlugin("scroll").provides();
      const target = highlights.find((h) => h.hid === GOTO_HL);
      const resumeTo = lastPage();                       // 딥링크가 없을 때만 0이 아니다
      const gotoPage = target ? target.page : (GOTO_PAGE || resumeTo);
      if (START_MODE === "reading") {
        await setMode("reading");
        if (gotoPage) {
          setTimeout(() => {
            const el = document.querySelector(`#readingContainer .rd-page[data-page="${gotoPage}"]`);
            if (el) el.scrollIntoView({ block: "start" });
          }, 400);
        }
      } else if (gotoPage) {
        setTimeout(() => scrollApi.scrollToPage({ pageNumber: gotoPage }), 300);
      }
      // 왜 여기서 알리냐면, 아무 말 없이 중간 페이지가 열리면 "왜 처음이 아니지?" 싶기 때문
      if (resumeTo && gotoPage === resumeTo) {
        setTimeout(() => toast(`${resumeTo}페이지부터 이어봅니다`), 700);
      }

      /* 현재 페이지 기록 — PDF 모드는 스크롤 플러그인이 알려준다({pageNumber}) */
      try { scrollApi.onPageChange((e) => saveLastPage(e && e.pageNumber)); } catch (e) {}
      /* 읽기 모드는 플러그인 바깥(직접 만든 DOM)이라 따로 본다.
         .reading 은 자체 스크롤이 없어 window 가 움직이므로 기본 root 로 충분하다.
         화면 위쪽에 걸친 페이지를 '지금 보는 페이지'로 친다. */
      const rdIo = new IntersectionObserver((ents) => {
        let top = null;
        for (const en of ents) {
          if (!en.isIntersecting) continue;
          const n = parseInt(en.target.dataset.page, 10);
          if (top === null || n < top) top = n;
        }
        if (top !== null) saveLastPage(top);
      }, { rootMargin: "0px 0px -70% 0px" });
      const watchReadingPages = () => {
        document.querySelectorAll("#readingContainer .rd-page").forEach((p) => {
          if (p.dataset.rvWatched) return;
          p.dataset.rvWatched = "1";
          rdIo.observe(p);
        });
      };
      watchReadingPages();
      // 읽기 본문은 모드를 처음 켤 때 만들어진다 → 늦게 생긴 페이지도 붙잡는다
      new MutationObserver(watchReadingPages)
        .observe(document.getElementById("readingContainer"), { childList: true });
      // 위의 위치잡기 setTimeout(300·400ms)이 끝나고 나서부터 기록한다
      setTimeout(startTracking, 1200);

      // 콘솔 디버그용 훅(문제 생겼을 때 상태를 바로 들여다볼 수 있게)
      window.__rv2 = { registry, annoApi, docApi, selApi, pageSizes,
                       get highlights() { return highlights; } };

      // 새 하이라이트/삭제를 기존 스키마로 반영
      annoApi.onAnnotationEvent((ev) => {
        if (!ev || !ev.annotation) return;
        const an = ev.annotation;
        // 캡처 사각형(SQ)은 지울 때만 반응한다 — 상자를 지우면 캡처 항목도 같이 없앤다
        if (an.type === SQ && ev.type === "delete") {
          const hid = idMap.get(an.id) || an.id;
          const i = highlights.findIndex((x) => x.hid === hid);
          if (i >= 0) { highlights.splice(i, 1); deletedHids.add(hid); persist(); }
          return;
        }
        if (an.type !== HL) return;                       // 그 밖의 도형·펜은 저장하지 않는다
        const pi = ev.pageIndex != null ? ev.pageIndex : an.pageIndex;
        const size = pageSizes[pi];
        if (!size) return;

        if (ev.type === "create" && ev.committed) {
          if (idMap.has(an.id)) return;                   // 기존 항목 표시분은 무시
          const hid = "h_" + Date.now();
          idMap.set(an.id, hid);
          const sel = lastSelection || {};
          highlights.push({
            hid, page: pi + 1,
            text: (an.contents || sel.text || "").trim(),
            rects: toNormRects(an.segmentRects, size),
            segs: sel.segs || undefined,
            color: nearestColorName(an.color),
            created_at: nowKst(),
          });
          lastSelection = null;
          persist();
        } else if (ev.type === "update" && ev.committed) {
          const hid = idMap.get(an.id);
          const h = highlights.find((x) => x.hid === hid);
          if (!h) return;
          h.rects = toNormRects(an.segmentRects, size);
          // 위치만 바뀐 갱신이면 색 정보가 안 실려 온다 → 원래 색을 지킨다
          h.color = nearestColorName(an.color, h.color);
          persist();
        } else if (ev.type === "delete") {
          const hid = idMap.get(an.id) || an.id;
          const i = highlights.findIndex((x) => x.hid === hid);
          if (i < 0) return;
          highlights.splice(i, 1);
          deletedHids.add(hid);
          persist();
        }
      });
    }

    requirePat(start);
  </script>
</body>
</html>
